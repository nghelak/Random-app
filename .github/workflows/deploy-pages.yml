name: Publish to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

# GitHub Pages serves this repo from the gh-pages branch (deploy-from-branch
# source). The workflow token isn't allowed to create/configure the Pages
# site via the API, so instead of actions/deploy-pages we publish by
# mirroring main into gh-pages, which triggers the built-in
# "pages build and deployment" run.
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Sync main to gh-pages
        run: git push --force origin HEAD:gh-pages
